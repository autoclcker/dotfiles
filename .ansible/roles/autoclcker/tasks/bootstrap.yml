---
- name: bootstrap | Install prerequisites on Archlinux system
  when: ansible_facts["os_family"] == "Archlinux"
  block:
    - name: bootstrap | Update pacman package cache
      community.general.pacman:
        update_cache: true
      changed_when: false

    - name: bootstrap | Install prerequisites
      community.general.pacman:
        name: "{{ autoclcker_prerequisites }}"
        state: present

- name: bootstrap | Ensure dotfiles group exists
  ansible.builtin.group:
    name: "{{ autoclcker_group | default('autoclcker') }}"
    state: present

- name: bootstrap | Ensure dotfiles user exists
  ansible.builtin.user:
    name: "{{ autoclcker_user | default('autoclcker') }}"
    password: "{{ autoclcker_password_hash | default('', true) }}"
    comment: "{{ autoclcker_comment | default(omit) }}"
    update_password: on_create
    state: present
    group: "{{ autoclcker_group | default('autoclcker') }}"
    createhome: true
  notify: Configure set password prompt

- name: bootstrap | Ensure dotfiles directory exists
  ansible.builtin.file:
    path: "{{ autoclcker_dotfiles_dst }}"
    state: directory
    owner: "{{ autoclcker_user | default('autoclcker') }}"
    group: "{{ autoclcker_group | default('autoclcker') }}"
    mode: "0755"
