5\Command="'use strict';\n// This script exists only for the correct operation of other scripts.\n\nfunction stateless() {\n    const row = selectedItems()[0];\n    if (row != 0) { return; }\n    plugins.itemtags.untag(\"Important\", row)\n    plugins.itempinned.unpin(row);\n}\n\nconst onItemsChanged_ = onItemsChanged;\nonItemsChanged = function() {\n    stateless();\n    return onItemsChanged_();\n};"
5\Icon=
