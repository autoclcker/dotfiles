4\Command="'use strict';\n\nconst history_tab = 'history';\nconst stack_tab = 'stack';\n\nfunction copyItem() {\n    const sel = ItemSelection().current();\n    if (sel.length !== 1) { return; }\n\n    const tab_name = ItemSelection().tab;\n    if (tab_name == history_tab || tab_name == stack_tab) { return; }\n\n    tab(history_tab);\n    write(0, sel.items());\n}\n\nconst onItemsAdded_ = onItemsAdded;\nonItemsAdded = function() {\n    copyItem();\n    return onItemsAdded_();\n};\n"
